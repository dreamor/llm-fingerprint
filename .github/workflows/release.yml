name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Git tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Git tag ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ 版本一致"

      - name: Bootstrap reference library
        run: node bin/fp.js bootstrap results/distributions.json

      - name: Run tests
        run: node --test test/*.test.js

      - name: Functional check — self-test match
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'fs';
            import { FingerprintDB } from './lib/db.js';
            import { match } from './lib/match.js';
            const ref = JSON.parse(readFileSync('data/reference.json'));
            const cells = ref.distributions.filter(r => r.model === 'openai/gpt-4o' && r.temperature === 1);
            const probeResult = { model: 'selftest', provider: 'test', temperature: 1, reps: 30, cells: cells.slice(0, 10) };
            const db = new FingerprintDB(); db.load();
            const r = match(db, probeResult);
            if (r.candidates[0].model !== 'openai/gpt-4o') process.exit(1);
            console.log('[self-test] OK — top match: ' + r.candidates[0].model);
          "

      - name: Publish to npm (OIDC trusted publisher)
        run: npm publish --access public