name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write   # needed for creating tag + release
  id-token: write   # needed for Trusted Publisher (npm provenance)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bootstrap reference library
        run: node bin/fp.js bootstrap results/distributions.json

      - name: Run tests
        run: node --test test/*.test.js

      - name: Functional check — self-test match
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'fs';
            import { FingerprintDB } from './lib/db.js';
            import { match } from './lib/match.js';
            const ref = JSON.parse(readFileSync('data/reference.json'));
            const cells = ref.distributions.filter(r => r.model === 'openai/gpt-4o' && r.temperature === 1);
            const probeResult = { model: 'selftest', provider: 'test', temperature: 1, reps: 30, cells: cells.slice(0, 10) };
            const db = new FingerprintDB(); db.load();
            const r = match(db, probeResult);
            if (r.candidates[0].model !== 'openai/gpt-4o') process.exit(1);
            console.log('[self-test] OK — top match: ' + r.candidates[0].model);
          "

  release-and-publish:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check if version tag already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Detected version: $TAG"
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists on remote — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          VER="${{ steps.check.outputs.version }}"

          # Generate release notes from commit log since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate 2>/dev/null || echo "")
          else
            NOTES="Initial release (commits: $(git rev-list --count HEAD))"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public