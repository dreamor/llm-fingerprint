name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to enable OIDC trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Git tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Git tag ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ 版本一致"

      - name: Bootstrap reference library
        run: node bin/fp.js bootstrap results/distributions.json

      - name: Run tests
        run: node --test test/*.test.js

      - name: Functional check — self-test match
        run: node scripts/self-test.mjs

      - name: Verify package contents
        run: |
          echo "📦 Checking package contents..."
          if npm pack --dry-run 2>&1 | grep -q '\.test\.js'; then
            echo "❌ Test files leaked into package!"
            exit 1
          fi
          echo "✅ Package contents look clean"

      - name: Publish to npm (OIDC trusted publisher)
        run: npm publish --provenance --access public