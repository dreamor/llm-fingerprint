name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Git tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Git tag ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ 版本一致"

      - name: Bootstrap reference library
        run: node bin/fp.js bootstrap results/distributions.json

      - name: Run tests
        run: node --test test/*.test.js

      - name: Functional check — self-test match
        run: node scripts/self-test.mjs

      - name: Publish to npm (OIDC trusted publisher)
        run: npm publish --access public