name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # allows release.yml to call this as a reusable workflow

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Bootstrap reference library
        run: node bin/fp.js bootstrap results/distributions.json

      - name: Run tests
        run: node --test test/*.test.js

      - name: Quick functional check — list
        run: node bin/fp.js list --family claude

      - name: Quick functional check — self-test match
        run: |
          node -e "
            import { readFileSync } from 'fs';
            import { FingerprintDB } from './lib/db.js';
            import { match } from './lib/match.js';
            const ref = JSON.parse(readFileSync('data/reference.json'));
            const cells = ref.distributions.filter(r => r.model === 'openai/gpt-4o' && r.temperature === 1);
            const probeResult = { model: 'selftest', provider: 'test', temperature: 1, reps: 30, cells: cells.slice(0, 10) };
            const db = new FingerprintDB(); db.load();
            const r = match(db, probeResult);
            if (r.candidates[0].model !== 'openai/gpt-4o') process.exit(1);
            console.log('[self-test] OK — top match: ' + r.candidates[0].model);
          "