name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # required for Trusted Publisher (npm provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance --access public
        # No NPM_TOKEN needed — Trusted Publisher uses OIDC
        # Set up via: npm token create --publish --oidc